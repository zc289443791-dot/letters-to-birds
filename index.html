<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0350e5"><title>把心事交给鸟</title>
<style>
@font-face{font-family:"BirdSong";src:url("./bird-assets/BirdSong-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap;}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0350e5}canvas{display:block;width:100%;height:100%;touch-action:manipulation}form{position:fixed;left:50%;bottom:26px;bottom:calc(26px + var(--safe-area-inset-bottom,0px));width:calc(100% - 56px);max-width:340px;transform:translateX(-50%);display:flex;align-items:center;transition:opacity .6s}
input{min-width:0;flex:1;padding:10px 4px;border:0;border-bottom:1px solid rgba(224,241,255,.36);border-radius:0;background:transparent;outline:0;color:#eaf4ff;caret-color:#cfe6ff;font:300 16px "BirdSong",serif;letter-spacing:.12em;text-align:center;transition:border-color .4s}
input::placeholder{color:rgba(231,245,255,.72)}input:focus{border-bottom-color:rgba(212,237,255,0.6000)}
button{display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;color:#e4f1ff;opacity:.9;cursor:pointer;transition:opacity .3s,background .3s}
button svg{width:30px;height:20px;transform-origin:50% 75%;filter:drop-shadow(0 0 4px rgba(140,196,255,0.6000))}
form.empty button{opacity:.35}button:hover,form.empty button:hover{opacity:1;background:rgba(171,207,255,0.0784)}
button:hover svg{animation:flap .45s ease-in-out infinite alternate}
form.busy{opacity:.35}form.busy button{cursor:default}form.busy svg{animation:flap .4s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.5)}}
button:focus{outline:1px solid #fff;outline-offset:2px}
@media(max-width:600px){input{font-size:16px}}

html{-webkit-tap-highlight-color:transparent}
body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button:active{opacity:1}
@supports(bottom:env(safe-area-inset-bottom)){
  form{bottom:calc(26px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
}
</style></head><body><canvas aria-hidden="true"></canvas><form class="empty" autocomplete="off"><input aria-label="写下想放飞的文字" maxlength="24" placeholder="写下一句，让鸟群带走…" spellcheck="false"><button aria-label="放飞" type="submit"><svg viewBox="0 0 36 24" fill="currentColor" aria-hidden="true"><path d="M18 14C14 8 8 5 2 5C7 9 11 13 16 17Z"/><path d="M18 14C22 8 28 5 34 5C29 9 25 13 20 17Z"/><ellipse cx="18" cy="16" rx="2.2" ry="3.4"/><circle cx="18" cy="12.2" r="1.7"/><path d="M16.4 18.5L18 23.5L19.6 18.5Z"/></svg></button></form>
<script src="./bird-assets/app-1.0.1.js"></script></body></html>
